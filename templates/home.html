<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fox AI</title>
  <link rel="stylesheet" href="/static/css/home.css">
</head>

<body>

  <div class="circle-overlay" id="circleOverlay"></div>
  <script>
    (function(){
      var phase = sessionStorage.getItem('foxTransitionPhase');
      if (phase !== 'toHome') return;
      var x = parseFloat(sessionStorage.getItem('foxOriginX'));
      var y = parseFloat(sessionStorage.getItem('foxOriginY'));
      if (isNaN(x) || isNaN(y)) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var r = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y));
      var root = document.documentElement;
      root.style.setProperty('--ox', x + 'px');
      root.style.setProperty('--oy', y + 'px');
      root.style.setProperty('--r', r + 'px');
      document.getElementById('circleOverlay').classList.add('no-transition');
    })();
  </script>

  <div class="hero">
    <img src="/static/assets/fox-logo.png" alt="Fox AI" class="hero-logo">
    <h1>Selamat datang di halaman utama!!</h1>
    <p>Ketuk ikon fox di kiri bawah buat mulai ngobrol sama Fox AI.</p>
  </div>

  <a href="/chatbot" class="fox-floating" id="foxFab">
    <img src="/static/assets/floating-button-fox-ai.png" alt="Fox AI">
    <span class="fox-tooltip">Tanya Fox AI</span>
  </a>

  <script src="/static/js/home.js"></script>
</body>
</html>
