<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1C1F23">
    <title>Mintif - HIMATIF</title>
    <link rel="icon" type="image/png" href="/static/assets/arthasa-logo.png">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Hide browser loading bar */
      html {
        overflow: hidden;
      }
      body {
        overflow: hidden;
      }
      ::-webkit-progress-bar,
      ::-webkit-progress-value,
      progress {
        display: none !important;
      }
    </style>
</head>
<body>
<div class="circle-overlay" id="circleOverlay"></div>
<script>
  (function(){
    // parity sama chatbot.html: cover layar sinkron sebelum first paint
    // pas balik dari chatbot (phase 'toHome'), biar reverse-nya mulus tanpa jeda.
    // Query dicek DULU (sessionStorage tidak nyebrang origin) + fallback query
    // yang dulu tidak ada.
    var overlay = document.getElementById('circleOverlay');
    var x = null, y = null, arrival = false;
    try {
      var q = new URLSearchParams(window.location.search);
      if (q.get('phase') === 'toHome') {
        var qx = parseFloat(q.get('ox')), qy = parseFloat(q.get('oy'));
        var vw0 = window.innerWidth || 1, vh0 = window.innerHeight || 1;
        x = isNaN(qx) ? vw0 / 2 : Math.min(Math.max(qx, 0), vw0);
        y = isNaN(qy) ? vh0 / 2 : Math.min(Math.max(qy, 0), vh0);
        arrival = true;
      }
    } catch(e) {}
    if (!arrival) {
      var phase = null;
      try { phase = sessionStorage.getItem('mintifTransitionPhase'); } catch(e) {}
      if (phase !== 'toHome') return;
      try { x = parseFloat(sessionStorage.getItem('mintifOriginX')); y = parseFloat(sessionStorage.getItem('mintifOriginY')); } catch(e) {}
      var vw1 = window.innerWidth || 1, vh1 = window.innerHeight || 1;
      if (isNaN(x) || isNaN(y)) { x = vw1 / 2; y = vh1 / 2; }
      x = Math.min(Math.max(x, 0), vw1);
      y = Math.min(Math.max(y, 0), vh1);
    }
    if (isNaN(x) || isNaN(y)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y)) / 50;
    var root = document.documentElement;
    root.style.setProperty('--ox', x + 'px');
    root.style.setProperty('--oy', y + 'px');
    root.style.setProperty('--s', s);
    overlay.classList.add('no-transition');
  })();
</script>
<div class="hero">
    <img
      src="/static/assets/arthasa-logo.png"
      alt="Arthasa"
      class="hero-logo"
    >

    <h1>Selamat datang di halaman utama!!</h1>

    <p>
      Ketuk ikon Arthasa di kiri bawah buat mulai ngobrol
      sama Mintif.
    </p>
</div>

<button
  class="mintif-floating"
  id="mintifFab"
  type="button"
  aria-label="Buka Mintif"
>
  <img
    src="/static/assets/floating-button-mintif.png"
    alt="Mintif"
  >

  <span class="mintif-tooltip">
    Tanya Mintif
  </span>
</button>

<script src="/static/js/home.js"></script>

</body>
</html>
