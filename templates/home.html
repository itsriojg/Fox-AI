<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1C1F23">
    <title>Mintif - HIMATIF</title>
    <link rel="icon" type="image/png" href="/static/assets/arthasa-logo.png">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Hide browser loading bar */
      html {
        overflow: hidden;
      }
      body {
        overflow: hidden;
      }
      ::-webkit-progress-bar,
      ::-webkit-progress-value,
      progress {
        display: none !important;
      }
    </style>
</head>
<body>
<div class="circle-overlay" id="circleOverlay"></div>
<script>
  (function(){
    // parity sama chatbot.html: cover layar sinkron sebelum first paint
    // pas balik dari chatbot (phase 'toHome'), biar reverse-nya mulus tanpa jeda
    var overlay = document.getElementById('circleOverlay');
    var phase = null;
    try { phase = sessionStorage.getItem('mintifTransitionPhase'); } catch(e) {}
    if (phase !== 'toHome') return;
    var x = null, y = null;
    try { x = parseFloat(sessionStorage.getItem('mintifOriginX')); y = parseFloat(sessionStorage.getItem('mintifOriginY')); } catch(e) {}
    if (isNaN(x) || isNaN(y)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var r = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y));
    var root = document.documentElement;
    root.style.setProperty('--ox', x + 'px');
    root.style.setProperty('--oy', y + 'px');
    root.style.setProperty('--r', r + 'px');
    overlay.classList.add('no-transition');
  })();
</script>
<div class="hero">
    <img
      src="/static/assets/arthasa-logo.png"
      alt="Arthasa"
      class="hero-logo"
    >

    <h1>Selamat datang di halaman utama!!</h1>

    <p>
      Ketuk ikon Arthasa di kiri bawah buat mulai ngobrol
      sama Mintif.
    </p>
</div>

<button
  class="mintif-floating"
  id="mintifFab"
  type="button"
  aria-label="Buka Mintif"
>
  <img
    src="/static/assets/floating-button-mintif.png"
    alt="Mintif"
  >

  <span class="mintif-tooltip">
    Tanya Mintif
  </span>
</button>

<script src="/static/js/home.js"></script>

</body>
</html>
