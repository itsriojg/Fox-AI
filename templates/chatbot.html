<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1C1F23">

    <title>Mintif</title>

    <link rel="stylesheet" href="/static/css/chatbot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Hide browser loading bar */
      html { 
        overflow: hidden;
      }
      body { 
        overflow: hidden;
      }
      ::-webkit-progress-bar,
      ::-webkit-progress-value,
      progress {
        display: none !important;
      }
    </style>
</head>
<body>
<div class="circle-overlay" id="circleOverlay"></div>
<script>
  // URL home web HIMATIF (tujuan tombol back). Diisi server dari env HOME_URL.
  window.MINTIF_HOME_URL = {{ home_url|tojson }};
</script>
<script>
  (function(){
    // Arrival = query ?phase=toChat (dicek DULU) ATAU sessionStorage toChat.
    // sessionStorage tidak nyebrang origin, gate lama (session dulu) bikin
    // first paint bocor: background chatbot ngintip sekilas sebelum entrance
    // snap ketutup lagi. Sekarang cover pre-paint selalu jalan.
    var x = null, y = null, arrival = false;
    try {
      var q = new URLSearchParams(window.location.search);
      if (q.get('phase') === 'toChat') {
        var qx = parseFloat(q.get('ox')), qy = parseFloat(q.get('oy'));
        var vw0 = window.innerWidth || 1, vh0 = window.innerHeight || 1;
        x = isNaN(qx) ? vw0 / 2 : Math.min(Math.max(qx, 0), vw0);
        y = isNaN(qy) ? vh0 / 2 : Math.min(Math.max(qy, 0), vh0);
        arrival = true;
      }
    } catch(e) {}
    if (!arrival) {
      var phase = null;
      try { phase = sessionStorage.getItem('mintifTransitionPhase'); } catch(e) {}
      if (phase !== 'toChat') return;
      try { x = parseFloat(sessionStorage.getItem('mintifOriginX')); y = parseFloat(sessionStorage.getItem('mintifOriginY')); } catch(e) {}
      // Fallback ke tengah viewport kalau koordinat cacat/tidak ada —
      // biar cover->open selalu main walau URL kiriman kurang ox/oy.
      var vw1 = window.innerWidth || 1, vh1 = window.innerHeight || 1;
      if (isNaN(x) || isNaN(y)) { x = vw1 / 2; y = vh1 / 2; }
      x = Math.min(Math.max(x, 0), vw1);
      y = Math.min(Math.max(y, 0), vh1);
    }
    if (isNaN(x) || isNaN(y)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    // Overlay lingkaran 100px di-scale GPU: s = radius_tutup / 50.
    var s = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y)) / 50;
    var root = document.documentElement;
    var overlay = document.getElementById('circleOverlay');
    overlay.style.removeProperty('--s');
    root.style.setProperty('--ox', x + 'px');
    root.style.setProperty('--oy', y + 'px');
    root.style.setProperty('--s', s);
    overlay.classList.add('no-transition');
  })();
</script>
<div id="mintifSplash" aria-hidden="true"><img src="/static/assets/arthasa-logo.png" alt=""></div>
<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <button class="back-button" id="back-button" aria-label="Kembali ke Home">
            ←
        </button>
        <div class="header-info">
            <div class="header-logo">
              <img src="/static/assets/arthasa-logo.png" alt="Arthasa Logo" width="42" height="42" loading="eager" decoding="async">
            </div>
            <div class="header-text">
                <h2>Mintif</h2>
                <p>Asisten AI HIMATIF</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot">
            </span>
            <span>Online</span>
        </div>
        <form id="clear-form">
          <button class="clear-button" type="submit" id="clear-button" aria-label="Hapus riwayat chat" {% if not riwayat_chat %}disabled{% endif %}>
            🗑
          </button>
        </form>
    </div>
    <div class="header-glow"></div>
    <!-- Chat Area -->
    <div class="chat-history" role="log" aria-live="polite" aria-label="Riwayat chat">
    <div class="welcome-screen">
      <div class="mintif-logo">
        <img src="/static/assets/arthasa-logo.png" alt="Arthasa Logo" width="180" height="180" loading="eager" decoding="async">
      </div>
      <div class="welcome-text">
        <h1>Selamat datang di Mintif</h1>
        <p>Teman AI-mu Soal HIMATIF</p>
      </div>
      <div class="suggestions">
        <button type="button" class="suggestion-btn">Apa itu HIMATIF?</button>
        <button type="button" class="suggestion-btn">Cara masuk HIMATIF?</button>
        <button type="button" class="suggestion-btn">Apa itu ARTHASA?</button>
        <button type="button" class="suggestion-btn">Mintif itu siapa?</button>
      </div>
    </div>
        <div id="messages">{% for pesan in riwayat_chat %}<div class="message {{ pesan['sender'] }}">{{ pesan["text"] }}</div>{% endfor %}</div>
        </div>

    <!-- Input -->
    <div class="chat-input">
        <form id="chat-form">
            <input
                id="chat-input"
                type="text"
                name="pesan"
                placeholder="Tanya apapun pada Mintif..."
                autocomplete="off"
                enterkeyhint="send"
                inputmode="text"
                aria-label="Tulis pesan untuk Mintif"
            >
            <button type="submit" disabled aria-label="Kirim pesan">
                ➜
            </button>
        </form>
    </div>
</div>

<script>
    const chatHistory = document.querySelector(".chat-history");
    chatHistory.scrollTop = chatHistory.scrollHeight;
</script>

<script src="/static/js/chatbot.js"></script>

</body>
</html>
