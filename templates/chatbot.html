<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

    <title>Fox AI</title>

    <link rel="stylesheet" href="/static/css/chatbot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="circle-overlay" id="circleOverlay"></div>
<script>
  (function(){
    var phase = sessionStorage.getItem('foxTransitionPhase');
    if (phase !== 'toChat') return;
    var x = parseFloat(sessionStorage.getItem('foxOriginX'));
    var y = parseFloat(sessionStorage.getItem('foxOriginY'));
    if (isNaN(x) || isNaN(y)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var r = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y));
    var root = document.documentElement;
    root.style.setProperty('--ox', x + 'px');
    root.style.setProperty('--oy', y + 'px');
    root.style.setProperty('--r', r + 'px');
    document.getElementById('circleOverlay').classList.add('no-transition');
  })();
</script>
<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <button class="back-button" id="back-button">
            ←
        </button>
        <div class="header-info">
            <div class="header-logo">
              <img src="/static/assets/fox-logo.png" alt="Fox AI Logo">
            </div>
            <div class="header-text">
                <h2>Fox AI</h2>
                <p>AI Assistant</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot">
            </span>
            <span>Online</span>
        </div>
        <form id="clear-form">
          <button class="clear-button" type="submit" id="clear-button" {% if not riwayat_chat %}disabled{% endif %}>
            🗑
          </button>
        </form>
    </div>
    <div class="header-glow"></div>
    <!-- Chat Area -->
    <div class="chat-history">
    <div class="welcome-screen">
      <div class="fox-logo">
        <img src="/static/assets/fox-logo.png" alt="Fox AI Logo">
      </div>
      <div class="welcome-text">
        <h1>Welcome to Fox AI</h1>
        <p>Your AI Assistant</p>
      </div>
      <div class="suggestions">
        <button type="button" class="suggestion-btn">Suggestion 1?</button>
        <button type="button" class="suggestion-btn">Suggestion 2?</button>
        <button type="button" class="suggestion-btn">Suggestion 3?</button>
        <button type="button" class="suggestion-btn">Suggestion 4?</button>
      </div>
    </div>
        <div id="messages">
          {% for pesan in riwayat_chat %}
          <div class="message {{pesan['sender']}}">
        {{pesan["text"]}}
    </div>
            {% endfor %}

          </div>
        </div>

    <!-- Input -->
    <div class="chat-input">
        <form id="chat-form">
            <input
                id="chat-input"
                type="text"
                name="pesan"
                placeholder="Tanya apapun pada Fox AI..."
                autocomplete="off"
            >
            <button type="submit" disabled>
                ➜
            </button>
        </form>
    </div>
</div>

<script>
    const chatHistory = document.querySelector(".chat-history");
    chatHistory.scrollTop = chatHistory.scrollHeight;
</script>

<script src="/static/js/chatbot.js"></script>

</body>
</html>
