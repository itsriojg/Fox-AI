<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1C1F23">

    <title>Fox AI</title>

    <link rel="stylesheet" href="/static/css/chatbot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Hide browser loading bar */
      html { 
        overflow: hidden;
      }
      body { 
        overflow: hidden;
      }
      ::-webkit-progress-bar,
      ::-webkit-progress-value,
      progress {
        display: none !important;
      }
    </style>
</head>
<body>
<div class="circle-overlay" id="circleOverlay"></div>
<script>
  (function(){
    var phase = null;
    try { phase = sessionStorage.getItem('foxTransitionPhase'); } catch(e) {}
    if (phase !== 'toChat') return;
    var x = null, y = null;
    try { x = parseFloat(sessionStorage.getItem('foxOriginX')); y = parseFloat(sessionStorage.getItem('foxOriginY')); } catch(e) {}
    if (isNaN(x) || isNaN(y)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var r = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y));
    var root = document.documentElement;
    var overlay = document.getElementById('circleOverlay');
    overlay.style.removeProperty('--r');
    root.style.setProperty('--ox', x + 'px');
    root.style.setProperty('--oy', y + 'px');
    root.style.setProperty('--r', r + 'px');
    overlay.classList.add('no-transition');
  })();
</script>
<div id="foxSplash" aria-hidden="true"><img src="/static/assets/fox-logo.png" alt=""></div>
<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <button class="back-button" id="back-button" aria-label="Kembali ke Home">
            ←
        </button>
        <div class="header-info">
            <div class="header-logo">
              <img src="/static/assets/fox-logo.png" alt="Fox AI Logo" width="42" height="42" loading="eager" decoding="async">
            </div>
            <div class="header-text">
                <h2>Fox AI</h2>
                <p>AI Assistant</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot">
            </span>
            <span>Online</span>
        </div>
        <form id="clear-form">
          <button class="clear-button" type="submit" id="clear-button" aria-label="Hapus riwayat chat" {% if not riwayat_chat %}disabled{% endif %}>
            🗑
          </button>
        </form>
    </div>
    <div class="header-glow"></div>
    <!-- Chat Area -->
    <div class="chat-history" role="log" aria-live="polite" aria-label="Riwayat chat">
    <div class="welcome-screen">
      <div class="fox-logo">
        <img src="/static/assets/fox-logo.png" alt="Fox AI Logo" width="180" height="180" loading="eager" decoding="async">
      </div>
      <div class="welcome-text">
        <h1>Welcome to Fox AI</h1>
        <p>Your AI Assistant</p>
      </div>
      <div class="suggestions">
        <button type="button" class="suggestion-btn">Suggestion 1?</button>
        <button type="button" class="suggestion-btn">Suggestion 2?</button>
        <button type="button" class="suggestion-btn">Suggestion 3?</button>
        <button type="button" class="suggestion-btn">Suggestion 4?</button>
      </div>
    </div>
        <div id="messages">{% for pesan in riwayat_chat %}<div class="message {{ pesan['sender'] }}">{{ pesan["text"] }}</div>{% endfor %}</div>
        </div>

    <!-- Input -->
    <div class="chat-input">
        <form id="chat-form">
            <input
                id="chat-input"
                type="text"
                name="pesan"
                placeholder="Tanya apapun pada Fox AI..."
                autocomplete="off"
                enterkeyhint="send"
                inputmode="text"
                aria-label="Tulis pesan untuk Fox AI"
            >
            <button type="submit" disabled aria-label="Kirim pesan">
                ➜
            </button>
        </form>
    </div>
</div>

<script>
    const chatHistory = document.querySelector(".chat-history");
    chatHistory.scrollTop = chatHistory.scrollHeight;
</script>

<script src="/static/js/chatbot.js"></script>

</body>
</html>
